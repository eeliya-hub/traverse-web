<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/traverse-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Without this, a phone browser lays the page out in a 980px-wide imaginary
    window and then zooms the result out to fit. Every width-based media query
    below would be answered against 980px and never match, and the app would be
    rendered at desktop size and shrunk rather than laid out for the device.
    viewport-fit=cover so the full-screen phone case reaches the display edges.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="traverse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>traverse</title>
  <link rel="manifest" href="manifest.json">

  <script>
    /*
      Is this a phone, or something big enough to show a phone on?

      The frame is a presentation device: on a desktop or an iPad it shows the
      app the shape it was designed for. On an actual phone it is absurd — a
      phone drawn inside a phone, with the real app shrunk to fit the picture.
      So below a certain size the frame comes off and the app just fills the
      screen, which is what it was built to do anyway.

      Two clauses, because a phone turned sideways is wide but short:
        max-width 600px   every phone in portrait (the widest is ~440px),
                          while an iPad mini is 744px and stays framed
        max-height 599px  the same phones in landscape (~390-440px tall),
                          limited to touch devices so a short desktop window
                          keeps its frame

      Stamped on <html> from here, before anything paints, so there is no
      flash of a frame that is about to be removed. The CSS below and
      fitFrame() at the end of the body both read this one query — if they
      disagreed, the app would end up full-screen AND scaled down to fit a
      frame that isn't there.
    */
    window.TRAVERSE_PHONE_MQ = window.matchMedia(
      '(max-width: 600px), (max-height: 599px) and (pointer: coarse)');

    (function () {
      function applyViewport() {
        document.documentElement.setAttribute(
          'data-viewport', window.TRAVERSE_PHONE_MQ.matches ? 'phone' : 'framed');
      }
      applyViewport();
      // Rotating a phone crosses the boundary in both directions.
      if (window.TRAVERSE_PHONE_MQ.addEventListener) {
        window.TRAVERSE_PHONE_MQ.addEventListener('change', applyViewport);
      } else {
        window.TRAVERSE_PHONE_MQ.addListener(applyViewport);
      }
    })();
  </script>

  <style>
    /*
      Confine the web app to an iPhone 16e-sized phone frame.
      iPhone 16e: 1170 x 2532 physical px at a 3.0 device pixel ratio
      => 390 x 844 CSS (logical) pixels, the resolution the app sees.
    */
    :root {
      --device-width: 390px;
      --device-height: 844px;
      --bezel: 14px;
      --screen-radius: 47px;
      /* Small gap above the app content (like a slim status-bar area). */
      --safe-top: 16px;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #2a2a30 0%, #121215 70%);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The physical phone body / bezel. */
    #phone-frame {
      position: relative;
      box-sizing: content-box;
      width: var(--device-width);
      height: var(--device-height);
      padding: var(--bezel);
      background: #0a0a0c;
      border-radius: calc(var(--screen-radius) + var(--bezel));
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.6),
        0 0 0 2px #2c2c30,
        inset 0 0 2px 1px rgba(255, 255, 255, 0.08);
      transform-origin: center center;
    }

    /* The actual screen — exactly the iPhone 16e logical resolution. */
    #phone-screen {
      position: relative;
      width: var(--device-width);
      height: var(--device-height);
      border-radius: var(--screen-radius);
      overflow: hidden;
      /* Matches the app's light background so the top gap blends in. */
      background: #ececec;
    }

    /*
      The Flutter mount. It spans from the top gap down to the very bottom
      edge, so Flutter measures and renders into exactly this area — the
      app starts below the gap and its bottom reaches the screen's bottom.
    */
    #app-host {
      position: absolute;
      top: var(--safe-top);
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Make the Flutter view fill the host element. */
    #app-host flutter-view,
    #app-host flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
    }

    /*
      On a phone there is no frame — the browser window already is one. Every
      decoration is stripped rather than hidden, so the app measures and
      renders at the device's own resolution instead of a fixed 390x844.
    */
    html[data-viewport="phone"],
    html[data-viewport="phone"] body {
      background: #ececec;
    }

    html[data-viewport="phone"] #phone-frame {
      width: 100%;
      height: 100%;
      /* dvh, so the frame does not sit under the browser chrome that appears
         and disappears as you scroll on iOS and Android. */
      height: 100dvh;
      padding: 0;
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      /* fitFrame() leaves this alone here, but a stale transform from a resize
         across the boundary would silently shrink the whole app. */
      transform: none !important;
    }

    html[data-viewport="phone"] #phone-screen {
      width: 100%;
      height: 100%;
      border-radius: 0;
    }

    /* No fake status-bar gap: the real one belongs to the real device. */
    html[data-viewport="phone"] #app-host {
      top: 0;
    }
  </style>

  <script>
    // Force preserveDrawingBuffer on WebGL so we can read back the rendered
    // frame to colour-match the top gap (see the sampler script below).
    // Must run before Flutter creates its WebGL/CanvasKit context.
    (function () {
      var orig = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
          attrs = attrs || {};
          attrs.preserveDrawingBuffer = true;
        }
        return orig.call(this, type, attrs);
      };
    })();
  </script>
</head>
<body>
  <div id="phone-frame">
    <div id="phone-screen">
      <div id="app-host"></div>
    </div>
  </div>

  <script>
    // Scale the whole frame down so it always fits inside the browser
    // window, without changing the resolution the app renders at.
    (function () {
      function fitFrame() {
        var frame = document.getElementById('phone-frame');
        if (!frame) return;

        // No frame on a phone, so nothing to fit it into. Scaling here would
        // shrink a full-screen app to 100% of itself minus the margin below.
        if (window.TRAVERSE_PHONE_MQ && window.TRAVERSE_PHONE_MQ.matches) {
          frame.style.transform = 'none';
          return;
        }

        var margin = 32;
        var availW = window.innerWidth - margin;
        var availH = window.innerHeight - margin;
        var scale = Math.min(
          availW / frame.offsetWidth,
          availH / frame.offsetHeight,
          1
        );
        // Only apply a transform when we actually need to shrink. A CSS
        // transform on an ancestor of the Flutter host can blank CanvasKit
        // rendering, so at full size we leave it untransformed.
        frame.style.transform = scale < 0.999 ? 'scale(' + scale + ')' : 'none';
      }
      window.addEventListener('resize', fitFrame);
      window.addEventListener('orientationchange', fitFrame);
      window.addEventListener('load', fitFrame);
      if (window.TRAVERSE_PHONE_MQ && window.TRAVERSE_PHONE_MQ.addEventListener) {
        window.TRAVERSE_PHONE_MQ.addEventListener('change', fitFrame);
      }
      fitFrame();
    })();
  </script>

  <script>
    // Blend the top gap with the app: sample the colour at the very top of
    // the rendered app and paint the screen background to match. This way the
    // gap follows whatever is at the top (green app bar, light page bg, ...)
    // instead of being an obvious fixed-colour strip.
    (function () {
      var screen = document.getElementById('phone-screen');
      var sampler = document.createElement('canvas');
      sampler.width = 1;
      sampler.height = 1;
      var sctx = sampler.getContext('2d', { willReadFrequently: true });

      // Collect canvases, descending through shadow roots — Flutter's
      // CanvasKit canvas lives inside the flt-glass-pane shadow DOM, which a
      // plain querySelectorAll won't reach.
      function collectCanvases(root, out) {
        var cs = root.querySelectorAll('canvas');
        for (var i = 0; i < cs.length; i++) out.push(cs[i]);
        var els = root.querySelectorAll('*');
        for (var j = 0; j < els.length; j++) {
          if (els[j].shadowRoot) collectCanvases(els[j].shadowRoot, out);
        }
      }

      function biggestCanvas(host) {
        var out = [];
        collectCanvases(host, out);
        var best = null, area = 0;
        for (var i = 0; i < out.length; i++) {
          var a = out[i].width * out[i].height;
          if (a > area) { area = a; best = out[i]; }
        }
        return best;
      }

      function tick() {
        var host = document.getElementById('app-host');
        var cv = host && biggestCanvas(host);
        if (cv && cv.width > 1 && cv.height > 1) {
          try {
            // One pixel, centred, a few device-px below the very top edge.
            sctx.drawImage(cv, (cv.width / 2) | 0, 6, 1, 1, 0, 0, 1, 1);
            var d = sctx.getImageData(0, 0, 1, 1).data;
            if (d[3] > 0) {
              screen.style.background = 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')';
            }
          } catch (e) { /* keep last colour */ }
        }
      }
      setInterval(tick, 150);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
